<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Тест по регламенту кандидата Секции "Мияги-До" — LARUSSO</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(to right, #1f2937, #111827);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1c1f26;
      padding: 40px;
      max-width: 750px;
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      position: relative;
    }
    .logo {
      display: block;
      margin: 0 auto 25px;
      max-width: 160px;
      border-radius: 50%;
      border: 3px solid #10b981;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
      color: #10b981;
      line-height: 1.3;
    }
    .question-label {
      font-weight: 600;
      margin-bottom: 12px;
      display: block;
      font-size: 16px;
    }
    .radio-group {
      margin-bottom: 25px;
    }
    .radio-label {
      display: block;
      background-color: #111827;
      padding: 14px 20px;
      border-radius: 12px;
      border: 2px solid #4b5563;
      cursor: pointer;
      margin-bottom: 10px;
      color: #e5e7eb;
      transition: 0.3s;
      position: relative;
    }
    .radio-label:hover {
      border-color: #10b981;
      background-color: #172022;
    }
    .radio-label input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 100%;
      width: 100%;
      top: 0;
      left: 0;
      margin: 0;
    }
    .radio-label input:checked + span {
      background-color: #10b981;
      color: white;
      border-radius: 10px;
      padding: 6px 12px;
      font-weight: 600;
      display: inline-block;
    }
    .error {
      color: #f87171;
      font-size: 13px;
      margin-top: -5px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background-color: #111827;
      color: #e5e7eb;
      margin-bottom: 20px;
    }
    button[type="button"] {
      width: 100%;
      padding: 14px;
      background-color: #10b981;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button[type="button"]:hover {
      background-color: #0f8e69;
    }
    .result {
      margin-top: 25px;
      padding: 20px;
      background-color: #065f46;
      border-radius: 15px;
      text-align: center;
      font-size: 18px;
      display: none;
      color: #e0ffe0;
      white-space: pre-line;
    }
    .retry-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ef4444;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: background-color 0.3s ease;
    }
    .retry-btn:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="LARUSSO Logo" class="logo" />
    <h1>Тест по регламенту кандидата Секции "Мияги-До" (КСМД)</h1>

    <form id="quizForm">

      <label for="name" class="question-label">Введите ваш ник:</label>
      <input type="text" id="name" placeholder="Например: Family_Larusso" />
      <div class="error" id="errorName"></div>

      <label class="question-label">1. Кому непосредственно подчиняется кандидат Секции "Мияги-До" (КСМД)?</label>
      <div class="radio-group" id="q1">
        <label class="radio-label"><input type="radio" name="q1" value="a"><span>Главе Секции</span></label>
        <label class="radio-label"><input type="radio" name="q1" value="b"><span>Мастеру Секции "Мияги-До" (МСМД), старшему мастеру, сенсею, главе, а в отсутствии оных — мастеру</span></label>
        <label class="radio-label"><input type="radio" name="q1" value="c"><span>Только главе</span></label>
        <label class="radio-label"><input type="radio" name="q1" value="d"><span>Любому члену семьи</span></label>
      </div>
      <div class="error" id="errorQ1"></div>

      <label class="question-label">2. Кандидат Секции "Мияги-До" имеет право обжаловать приказ (наказание) мастера Секции "Мияги-До" (МСМД):</label>
      <div class="radio-group" id="q2">
        <label class="radio-label"><input type="radio" name="q2" value="a"><span>В любое время и в любой форме</span></label>
        <label class="radio-label"><input type="radio" name="q2" value="b"><span>Только после выполнения приказа и подавая рапорт лично главе</span></label>
        <label class="radio-label"><input type="radio" name="q2" value="c"><span>Не имеет права обжаловать</span></label>
        <label class="radio-label"><input type="radio" name="q2" value="d"><span>Только через старшего мастера</span></label>
      </div>
      <div class="error" id="errorQ2"></div>

      <label class="question-label">3. Кандидат Секции "Мияги-До" может проверять правила у:</label>
      <div class="radio-group" id="q3">
        <label class="radio-label"><input type="radio" name="q3" value="a"><span>Главы</span></label>
        <label class="radio-label"><input type="radio" name="q3" value="b"><span>Старшего мастера</span></label>
        <label class="radio-label"><input type="radio" name="q3" value="c"><span>Младшего состава (1-5 ранг)</span></label>
        <label class="radio-label"><input type="radio" name="q3" value="d"><span>Сенсея</span></label>
      </div>
      <div class="error" id="errorQ3"></div>

      <label class="question-label">4. Какие навыки обязан иметь КСМД?</label>
      <div class="radio-group" id="q4">
        <label class="radio-label"><input type="radio" name="q4" value="a"><span>Только навыки стрельбы из дигла и М4</span></label>
        <label class="radio-label"><input type="radio" name="q4" value="b"><span>Все навыки боя, включая удары, захваты, а также совершенствовать навыки стрельбы</span></label>
        <label class="radio-label"><input type="radio" name="q4" value="c"><span>Только навыки рукопашного боя</span></label>
        <label class="radio-label"><input type="radio" name="q4" value="d"><span>Только владение оружием</span></label>
      </div>
      <div class="error" id="errorQ4"></div>

      <label class="question-label">5. Что обязан иметь КСМД для управления транспортными средствами и оружием?</label>
      <div class="radio-group" id="q5">
        <label class="radio-label"><input type="radio" name="q5" value="a"><span>Документы от главы</span></label>
        <label class="radio-label"><input type="radio" name="q5" value="b"><span>Лицензии на все виды ТС и оружия</span></label>
        <label class="radio-label"><input type="radio" name="q5" value="c"><span>Согласие мастера</span></label>
        <label class="radio-label"><input type="radio" name="q5" value="d"><span>Не требуется никаких документов</span></label>
      </div>
      <div class="error" id="errorQ5"></div>

      <label class="question-label">6. В каких мероприятиях обязан принимать участие КСМД?</label>
      <div class="radio-group" id="q6">
        <label class="radio-label"><input type="radio" name="q6" value="a"><span>В семейных боевых операциях</span></label>
        <label class="radio-label"><input type="radio" name="q6" value="b"><span>Только в тренировках</span></label>
        <label class="radio-label"><input type="radio" name="q6" value="c"><span>В собрании семьи</span></label>
        <label class="radio-label"><input type="radio" name="q6" value="d"><span>В мероприятиях только в своем городе</span></label>
      </div>
      <div class="error" id="errorQ6"></div>

      <button type="button" id="submitBtn">Проверить</button>
    </form>

    <div class="result" id="resultBox"></div>
    <button class="retry-btn" id="retryBtn">Начать заново</button>
  </div>

  <script>
    const correctAnswers = {
      q1: "b",
      q2: "b",
      q3: "c",
      q4: "b",
      q5: "b",
      q6: "a"
    };

    const form = document.getElementById('quizForm');
    const resultBox = document.getElementById('resultBox');
    const retryBtn = document.getElementById('retryBtn');
    const submitBtn = document.getElementById('submitBtn');

    function clearErrors() {
      document.getElementById('errorName').textContent = "";
      for (let i = 1; i <= 6; i++) {
        document.getElementById('errorQ'+i).textContent = "";
      }
    }

    function getSelectedValue(name) {
      const radios = document.getElementsByName(name);
      for (const radio of radios) {
        if (radio.checked) return radio.value;
      }
      return null;
    }

    submitBtn.addEventListener('click', () => {
      clearErrors();
      let isError = false;
      const nameVal = document.getElementById('name').value.trim();
      if (!nameVal) {
        document.getElementById('errorName').textContent = "Пожалуйста, введите ник.";
        isError = true;
      }
      let answers = {};
      for (let i = 1; i <= 6; i++) {
        let val = getSelectedValue('q'+i);
        if (!val) {
          document.getElementById('errorQ'+i).textContent = "Выберите вариант ответа.";
          isError = true;
        }
        answers['q'+i] = val;
      }
      if (isError) return;

      let score = 0;
      for (let i = 1; i <= 6; i++) {
        if (answers['q'+i] === correctAnswers['q'+i]) score++;
      }

      resultBox.style.display = 'block';
      resultBox.innerHTML = `
      <h2>Результаты теста, ${nameVal}:</h2>
      <p>Вы набрали ${score} из 6 баллов.</p>
      <p>${score === 6 ? "Поздравляем! Вы успешно прошли тест." : "Попробуйте еще раз для достижения максимального результата."}</p>
      <p><em>Не забудьте сделать скриншот для заявки.</em></p>
    `;

      form.style.display = 'none';
      submitBtn.style.display = 'none';
      retryBtn.style.display = 'inline-block';
    });

    retryBtn.addEventListener('click', () => {
      form.reset();
      form.style.display = 'block';
      resultBox.style.display = 'none';
      retryBtn.style.display = 'none';
      submitBtn.style.display = 'inline-block';
      document.getElementById('name').value = "";
    });
  </script>
</body>
</html>
